<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:Nunito,sans-serif;color:#fff;position:relative;
 background:radial-gradient(900px 700px at 95% 12%,#ff8a6b 0%,transparent 62%),
            radial-gradient(900px 900px at 0% 75%,#7b3fa0 0%,transparent 62%),
            linear-gradient(165deg,#e2557d 0%,#a8457f 55%,#5b2b7a 100%)}
.note{position:absolute;color:rgba(255,255,255,.10);font-weight:900}
.top{position:absolute;left:0;right:0;top:90px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.top img{width:150px;height:150px;border-radius:36px;box-shadow:0 14px 34px rgba(60,10,50,.35)}
.top .n{font-size:80px;font-weight:900;line-height:1}
.top .t{font-size:26px;font-weight:800;color:#ffe3d6;letter-spacing:.16em}
h1{position:absolute;left:60px;right:60px;top:450px;text-align:center;font-weight:900;font-size:78px;line-height:1.04;letter-spacing:-.015em}
h1 em{font-style:normal;color:#ffd166}
.phone{position:absolute;width:300px;height:534px;border-radius:46px;background:#2b1d2f;padding:12px;box-shadow:0 30px 60px rgba(40,5,40,.5),0 0 0 2px rgba(255,255,255,.18)}
.phone .scr{width:100%;height:100%;border-radius:36px;overflow:hidden;background:#fff8f1}
.phone img{width:100%;display:block}
.p1{left:220px;top:650px;transform:rotate(-7deg);z-index:2}
.p2{left:560px;top:690px;transform:rotate(7deg);z-index:1}
.love{position:absolute;left:0;right:0;top:1222px;text-align:center;z-index:3}
.love span{display:inline-block;background:#fff8f1;color:#7b3fa0;font-weight:900;font-size:32px;padding:16px 28px;border-radius:26px;box-shadow:0 12px 30px rgba(40,5,40,.4)}
.love svg{width:30px;height:28px;vertical-align:-4px;margin-right:10px}
.feats{position:absolute;left:60px;right:60px;top:1326px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:14px 18px;font-size:25px;font-weight:900;display:flex;align-items:center;gap:12px}
.f i{font-style:normal;font-size:30px}
.bottom{position:absolute;left:50px;right:50px;bottom:150px;height:250px;background:#fff;color:#2b1d2f;border-radius:34px;display:flex;align-items:center;padding:0 30px;gap:28px}
.bottom .qr img{width:200px;height:200px;display:block}
.bottom .cta b{display:block;font-size:50px;font-weight:900;line-height:1.02;color:#c43a66}
.bottom .cta span{display:block;font-size:22px;font-weight:700;color:#6f6072;margin-top:8px}
.bottom .cta .play{display:inline-block;margin-top:12px;background:#2b1d2f;color:#fff;font-size:21px;font-weight:800;padding:9px 18px;border-radius:14px}
.brand{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-size:17px;font-weight:700;color:#6f6072;line-height:1.35;text-align:right}
.brand img{width:54px;height:54px}
.brand b{color:#2b1d2f;font-weight:900}
</style></head><body>
<div class="note" style="left:80px;top:80px;font-size:120px">♪</div>
<div class="note" style="left:900px;top:420px;font-size:100px">♫</div>
<div class="note" style="left:70px;top:1180px;font-size:100px">♬</div>
<div class="top"><img src="geetar-icon.png"><div class="n">Geetar</div><div class="t">LEARN GUITAR FROM ZERO</div></div>
<h1>From first string<br>to <em>first song</em></h1>
<div class="phone p2"><div class="scr"><img src="geetar-tuner.png"></div></div>
<div class="phone p1"><div class="scr"><img src="geetar-home.png"></div></div>
<div class="love"><span><svg viewBox="0 0 24 22"><path d="M12 21s-9-5.8-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.2-9 12-9 12z" fill="#e2557d"/></svg>Made with Love for Pari</span></div>
<div class="feats">
 <div class="f"><i>🎯</i>Tuner in plain words</div>
 <div class="f"><i>📚</i>27 lessons, 3 levels</div>
 <div class="f"><i>🎵</i>Songs with Play along</div>
 <div class="f"><i>🖐️</i>29 chords to hear</div>
</div>
<div class="bottom">
 <div class="qr"><img src="qr-geetar-play.svg"></div>
 <div class="cta"><b>Scan to install</b><span>No sign-up needed</span><div class="play">▶ Free on Google Play</div></div>
 <div class="brand"><img src="homilabs-mark.svg"><div><b>Created By:</b> HomiLabs<br><b>Managed By:</b> Awaiz Fatima</div></div>
</div>
</body></html>
